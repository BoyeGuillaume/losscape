name: Publish image

# Push a tag `server-v<version>` to publish the server image on Docker Hub, for Intel and ARM
# Linux. Each is built on its own processor: compiling under emulation takes hours. Run by
# hand, it builds and checks the images but publishes nothing. Setup: docs/DEPLOYMENT.md.
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag is the version being built, and there's somewhere to publish it
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "server-v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $VERSION in Cargo.toml"
            exit 1
          fi
          if [ -z "$IMAGE" ]; then
            echo "::error::set the repository variable DOCKERHUB_REPOSITORY"
            exit 1
          fi

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      LABELS: |
        org.opencontainers.image.title=losscape
        org.opencontainers.image.description=Self-hosted ML experiment tracker: server and web interface
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ env.LABELS }}
          tags: losscape:check
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: It runs, and is the version it says
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          reported=$(docker run --rm losscape:check --version)
          echo "$reported"
          if [ "$reported" != "losscape-server $VERSION" ]; then
            echo "::error::expected version $VERSION"
            exit 1
          fi
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # By digest: no tag exists until every platform has passed.
      - id: push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=docker.io/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag it, for both processors
        working-directory: digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sources=()
          for digest in *; do sources+=("docker.io/$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "docker.io/$IMAGE:$VERSION" \
            -t "docker.io/$IMAGE:${VERSION%.*}" \
            -t "docker.io/$IMAGE:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "docker.io/$IMAGE:$VERSION"
