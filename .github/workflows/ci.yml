name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: losscape
          POSTGRES_PASSWORD: losscape
          POSTGRES_DB: losscape
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U losscape" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: losscape
          CLICKHOUSE_PASSWORD: losscape
          CLICKHOUSE_DB: losscape
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse client --user losscape --password losscape --query 'SELECT 1'"
          --health-interval 2s --health-retries 30
    env:
      # Integration tests (crates/losscape-server/tests) run against these services.
      DATABASE_URL: postgres://losscape:losscape@localhost:5432/losscape
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: losscape
      CLICKHOUSE_PASSWORD: losscape
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The web bundle's are checked by its build, above.
      - run: python3 scripts/third_party_notices.py --check

  # The SDK on every platform we ship wheels for, with the native part built there.
  sdk-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest

  # What's in tests/test_model.py beyond stand-ins, with a real PyTorch.
  sdk-pytorch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --with torch --index https://download.pytorch.org/whl/cpu pytest tests/test_model.py

  # The real thing: the image, compose.yaml, a run through the SDK, a restart.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: sdk/python
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: A fresh server works
        working-directory: sdk/python
        run: uv run python ../../scripts/deploy_smoke.py --state /tmp/smoke.json
      - name: Stopping is clean, and quick
        run: |
          start=$(date +%s)
          docker compose stop losscape
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took} s"
          docker compose logs losscape | tail -5
          docker compose logs losscape | grep -q "stopped"
          test "$took" -lt 20
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Nothing was lost
        working-directory: sdk/python
        run: uv run python ../../scripts/deploy_smoke.py --after-restart --state /tmp/smoke.json
      - name: It runs as it should
        run: |
          docker compose exec -T losscape losscape-server --version
          docker compose exec -T losscape losscape-server healthcheck
          # The databases aren't published to the host.
          ! curl -s -m 3 http://localhost:8123/ping
          ! (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null
      - if: failure()
        run: docker compose ps -a; docker compose logs --tail 100
