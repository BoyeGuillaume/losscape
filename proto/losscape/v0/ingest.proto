// SDK <-> server ingestion protocol, version 0.
//
// Transport: HTTPS POST, body = one protobuf message,
//   Content-Type: application/x-protobuf
//   Content-Encoding: zstd            (optional, recommended for LogBatch)
//   Authorization: Bearer <api key>
//   X-Losscape-Protocol: 0
//
// Endpoints:
//   POST /api/v0/runs/init     RunInit      -> RunInitResponse
//   POST /api/v0/ingest        LogBatch     -> Ack
//   POST /api/v0/runs/heartbeat Heartbeat   -> Ack
//   POST /api/v0/runs/finish   RunFinish    -> Ack
//
// Run IDs are UUIDv7 (16 raw bytes) generated by the client, so `init()` never waits
// for the server. Every batch carries (run_id, seq); the server drops batches it has
// already stored, so the client can retry freely. A batch is only acknowledged once
// its data is durable; the client keeps it in its local log until then.

syntax = "proto3";

package losscape.v0;

message RunInit {
  bytes run_id = 1;           // UUIDv7, 16 bytes
  string project = 2;         // "<project>" or "<entity>/<project>"
  string name = 3;            // human-readable; generated client-side when not provided
  string group = 4;
  repeated string tags = 5;
  string notes = 6;
  string config_json = 7;     // JSON object; arbitrary nesting
  int64 client_time_ms = 8;   // unix epoch ms, client clock
  bool resume = 9;            // true: attach to an existing run with this id
  RunEnvironment environment = 10;
}

message RunEnvironment {
  string hostname = 1;
  string command = 2;
  string python_version = 3;
  string sdk_version = 4;
  string git_remote = 5;
  string git_commit = 6;
  bool git_dirty = 7;
}

message RunInitResponse {
  bytes run_id = 1;
  string project = 2;
  string name = 3;
  // Next seq the server expects; non-zero when resuming.
  uint64 next_seq = 4;
  // Highest step already stored, so a resumed run can continue from there.
  optional uint64 last_step = 5;
}

// Scalar points in columnar form. All columns have the same length; row i is
// (keys[key_idx[i]], step[i], time_ms[i], value[i]).
message ScalarColumns {
  repeated string keys = 1;          // per-batch key dictionary
  repeated uint32 key_idx = 2;
  repeated uint64 step = 3;
  repeated int64 time_ms = 4;        // unix epoch ms, client clock
  repeated double value = 5;
}

message LogBatch {
  bytes run_id = 1;
  uint64 seq = 2;                    // per-run, starts at 0, strictly increasing
  ScalarColumns scalars = 3;
  // Summary values to merge into the run's summary (JSON object).
  string summary_json = 4;
  // Config values to merge into the run's config (JSON object).
  string config_json = 5;
  // Every seq below this has been acknowledged to the client, which will never send it
  // again. Lets the server close gaps in its dedup window (e.g. after losing recent
  // window updates in a database crash). 0 = unknown.
  uint64 confirmed_below = 6;
}

message Heartbeat {
  bytes run_id = 1;
  int64 client_time_ms = 2;
}

enum RunExitState {
  RUN_EXIT_STATE_UNSPECIFIED = 0;
  RUN_EXIT_STATE_FINISHED = 1;
  RUN_EXIT_STATE_FAILED = 2;
  RUN_EXIT_STATE_KILLED = 3;
}

message RunFinish {
  bytes run_id = 1;
  RunExitState state = 2;
  int32 exit_code = 3;
  int64 client_time_ms = 4;
  // seq of the last LogBatch; the server marks the run finished once all are stored.
  uint64 last_seq = 5;
}

message Ack {
  bytes run_id = 1;
  uint64 seq = 2;
  // true when this seq had already been stored (retry of a duplicate).
  bool duplicate = 3;
}

message Error {
  string code = 1;      // stable, machine-readable, e.g. "unsupported_protocol"
  string message = 2;
}
