[workspace]
resolver = "3"
members = ["crates/losscape-core", "crates/losscape-server", "crates/losscape-py"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/BoyeGuillaume/losscape"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
