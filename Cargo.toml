[workspace]
resolver = "3"
members = ["crates/losscape-core", "crates/losscape-server", "crates/losscape-py", "crates/losscape-loadgen", "crates/losscape-client"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89"  # File::try_lock
repository = "https://github.com/BoyeGuillaume/losscape"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
