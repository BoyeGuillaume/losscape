[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "losscape"
description = "Python SDK for losscape, a self-hosted ML experiment tracker"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
losscape = "losscape.cli:main"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "ruff>=0.12"]

[tool.maturin]
manifest-path = "../../crates/losscape-py/Cargo.toml"
module-name = "losscape._native"
python-source = "src"
features = ["extension-module"]

[tool.uv]
# Rebuild the native extension when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../crates/**/*.rs" },
    { file = "../../crates/**/Cargo.toml" },
    { file = "../../proto/**/*.proto" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
