# Settings as a file, for running the server without containers:
#   losscape-server --config losscape.toml      (or LOSSCAPE_CONFIG=losscape.toml)
#
# Environment variables win over this file, so secrets can stay out of it. A key the server
# doesn't know stops it from starting, rather than quietly leaving a default in place.

listen = "0.0.0.0:8080"
# Where users reach the server. Needed for OAuth; https:// also makes cookies Secure.
# public_url = "https://losscape.example.com"
# open: anyone who can reach the server may create an account; closed: only the first.
signup = "open"
# forbidden: no administrator account, ever (and one from before can't be used).
admin = "allowed"
# approval: users ask for new projects; the administrator accepts or rejects them. With admin
# forbidden too, projects are locked: none can be created until restarted.
projects = "open"
# Reverse proxies whose X-Forwarded-For is believed, as addresses or networks.
# trusted_proxies = ["127.0.0.1"]
web_dir = "web/build"
# The name shown in the interface, and your own images, read at startup: png, jpg, webp, avif,
# gif, svg or ico, up to 16 MB.
# app_name = "Acme Experiments"
# favicon = "/etc/losscape/favicon.svg"
# auth_background = "/etc/losscape/background.jpg"
max_body_mb = 32
# Where checkpoints go: a folder (absolute path) or s3://bucket/prefix, with the AWS_*
# settings in the environment. Without it, checkpoints aren't kept.
storage = "/var/lib/losscape/checkpoints"
max_checkpoint_gb = 100

# HTTPS rather than plain HTTP, with this certificate (and its chain) and key, PEM files read
# again when they change. For the hop from a reverse proxy on another machine; see
# docs/DEPLOYMENT.md, Setting it up by hand.
# [tls]
# cert = "/etc/losscape/tls/server.pem"
# key = "/etc/losscape/tls/server.key"

[database]
# On another machine, encrypted, checking the server's certificate against your CA:
# "postgres://losscape@db.internal/losscape?sslmode=verify-full&sslrootcert=/etc/losscape/tls/ca.pem"
# with sslcert= and sslkey= for a client certificate.
url = "postgres://losscape:losscape@localhost:5432/losscape"

[clickhouse]
url = "http://localhost:8123"
user = "losscape"
password = "losscape"
database = "losscape"
# For an https:// url: the CA its certificate is checked against, instead of the public ones,
# and a client certificate, if it asks for one.
# ca_cert = "/etc/losscape/tls/ca.pem"
# client_cert = "/etc/losscape/tls/client.pem"
# client_key = "/etc/losscape/tls/client.key"

[ingest]
flush_interval_ms = 250
flush_max_rows = 200000
queue = 4096

# Sign-in with external providers: one section each, named as in the redirect URI
# <public_url>/api/v1/auth/oauth/<id>/callback

# Any OpenID Connect provider:
# [oauth.google]
# issuer = "https://accounts.google.com"
# client_id = "..."
# client_secret = "..."
# name = "Google"

# GitHub (url and api_url for GitHub Enterprise):
# [oauth.github]
# client_id = "..."
# client_secret = "..."
