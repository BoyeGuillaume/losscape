# HTTPS through Caddy, on port 443 only: no plain HTTP anywhere, and nothing else of losscape
# reachable from outside (the server's own port is closed). Used with compose.yaml, by adding
# to .env:
#
#   COMPOSE_FILE=compose.yaml:deploy/compose.https.yaml
#   LOSSCAPE_DOMAIN=losscape.example.com
#   LOSSCAPE_PUBLIC_URL=https://losscape.example.com
#
# and, for a certificate of your own rather than Let's Encrypt's (a name on internal DNS):
#
#   LOSSCAPE_CERTIFICATE=files      # certs/cert.pem (with its chain) and certs/key.pem
#
# See docs/DEPLOYMENT.md, HTTPS. Needs Docker Compose 2.24.4 or newer (`!reset`).
services:
  losscape:
    ports: !reset []
    environment:
      # Caddy, below: the only one whose X-Forwarded-For is believed.
      LOSSCAPE_TRUSTED_PROXIES: 172.30.42.10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [losscape]
    ports:
      - "${LOSSCAPE_HTTPS_BIND:-0.0.0.0}:443:443"
      - "${LOSSCAPE_HTTPS_BIND:-0.0.0.0}:443:443/udp" # HTTP/3
    environment:
      LOSSCAPE_DOMAIN: ${LOSSCAPE_DOMAIN:?set LOSSCAPE_DOMAIN in .env}
      LOSSCAPE_CERTIFICATE: ${LOSSCAPE_CERTIFICATE:-acme}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LOSSCAPE_CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      edge:
        ipv4_address: 172.30.42.10

volumes:
  caddy_data:
  caddy_config:
