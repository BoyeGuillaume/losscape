[package]
name = "losscape-server"
description = "losscape API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "losscape-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
clickhouse = { version = "0.13.3", features = ["uuid"] }
losscape-core = { path = "../losscape-core" }
dotenvy = "0.15.7"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
zstd = "0.14.3"

[features]
# `losscape_server::testing`: run a server on fresh databases from other crates' tests.
testing = []

[dev-dependencies]
http-body-util = "0.1.5"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.1", features = ["v7"] }
zstd = "0.14.3"

[lints]
workspace = true
