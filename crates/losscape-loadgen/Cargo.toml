[package]
name = "losscape-loadgen"
description = "Load generator for the losscape ingest API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
losscape-core = { path = "../losscape-core" }
dotenvy = "0.15.7"
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
zstd = "0.14.3"

[lints]
workspace = true
