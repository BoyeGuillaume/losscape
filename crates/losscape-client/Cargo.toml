[package]
name = "losscape-client"
description = "Client core of the losscape SDKs: buffering, local log, upload, sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
crc32fast = "1.5.3"
losscape-core = { path = "../losscape-core" }
gethostname = "1.1.0"
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
losscape-server = { path = "../losscape-server", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
